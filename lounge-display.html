<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Buff — Lounge Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Baloo+2:wght@700;800&family=Sacramento&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a227;
  --gold-bright:#e0bd4f;
  --cream:#f3efe2;
  --vh:1vh;
  --vw:1vw;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#000;
  color:var(--cream);
  font-family:'Cormorant Garamond',serif;
  overflow:hidden;
}

/* ROTATOR — anchors the whole display and handles 0/90/180/270 rotation.
   Uses TRUE viewport vh/vw (not the --vh/--vw custom properties, which represent
   the EFFECTIVE/post-rotation dimensions used for sizing everything inside it). */
#rotator{
  position:fixed;
  top:0;
  left:0;
  background:#000;
}
#rotator.rot-0{
  width:100vw;
  height:100vh;
  transform:none;
}
#rotator.rot-180{
  width:100vw;
  height:100vh;
  transform:rotate(180deg);
  transform-origin:center center;
}
#rotator.rot-90{
  width:100vh;
  height:100vw;
  transform:rotate(90deg) translateY(-100%);
  transform-origin:top left;
}
#rotator.rot-270{
  width:100vh;
  height:100vw;
  transform:rotate(-90deg) translateX(-100%);
  transform-origin:top left;
}
.display{
  height:100%;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  text-align:center;
  padding:calc(var(--vh) * 1.5) calc(var(--vw) * 2) calc(var(--vh) * 1.5);
  overflow-y:auto;
}

/* LOGO */
.logo{
  font-family:'Sacramento',cursive;
  font-size:clamp(30px,calc(var(--vh) * 6.5),58px);
  color:var(--gold-bright);
  line-height:1;
}
.logo-img{
  max-width:calc(var(--vw) * 70);
  max-height:calc(var(--vh) * 12);
  object-fit:contain;
  display:none;
}

.divider{
  width:64%;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:calc(var(--vh) * 0.9) 0;
  flex-shrink:0;
}

/* WAIT TIME (live) */
.wait-section{width:100%}
.wait-label{
  font-size:clamp(10px,calc(var(--vh) * 1.5),14px);
  text-transform:uppercase;
  letter-spacing:3px;
  color:var(--gold);
}
.wait-time{
  font-size:clamp(48px,calc(var(--vh) * 10.5),104px);
  font-weight:700;
  line-height:1;
  color:var(--cream);
  margin-top:calc(var(--vh) * 0.6);
  transition:all 0.4s ease;
}
.wait-unit{
  font-size:clamp(15px,calc(var(--vh) * 2.4),22px);
  color:var(--cream);
  opacity:0.8;
  margin-top:calc(var(--vh) * 0.4);
}
.wait-stats{
  font-size:clamp(16px,calc(var(--vh) * 2.6),24px);
  font-weight:600;
  color:var(--cream);
  opacity:0.85;
  margin-top:calc(var(--vh) * 1.2);
  letter-spacing:0.5px;
}

/* MENU */
.menu-section{width:100%}
.menu-cat-label{
  font-size:clamp(10px,calc(var(--vh) * 1.3),13px);
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--gold);
  margin-top:calc(var(--vh) * 1.6);
  margin-bottom:calc(var(--vh) * 0.6);
}
.menu-cat-label:first-child{margin-top:0}
.menu-row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  width:96%;
  max-width:1850px;
  font-size:clamp(22px,calc(var(--vh) * 3.6),40px);
  margin:calc(var(--vh) * 0.3) auto;
}
.menu-row .mname{color:var(--cream)}
.menu-row .mprice{color:var(--cream);font-weight:600}
.menu-empty{
  font-size:clamp(12px,calc(var(--vh) * 1.8),16px);
  color:var(--cream);
  opacity:0.5;
  font-style:italic;
}

/* TODAY'S SPECIAL (only rendered when at least one is active for today) */
.special-title{
  font-family:'Baloo 2',sans-serif;
  font-weight:800;
  font-size:clamp(20px,calc(var(--vh) * 3.6),34px);
  color:var(--gold-bright);
  margin-bottom:calc(var(--vh) * 0.6);
}
.special-item{margin-bottom:calc(var(--vh) * 0.8)}
.special-item:last-child{margin-bottom:0}
.special-name-row{
  display:flex;
  justify-content:center;
  align-items:baseline;
  gap:0.6em;
  font-size:clamp(18px,calc(var(--vh) * 3),30px);
}
.special-name{color:var(--cream);font-weight:600}
.special-price{color:var(--cream);font-weight:700}
.special-tag{
  font-size:clamp(10px,calc(var(--vh) * 1.4),14px);
  font-weight:700;
  background:#2a1f0e;
  color:var(--gold);
  padding:2px 10px;
  border-radius:12px;
}
.special-desc{
  font-size:clamp(12px,calc(var(--vh) * 1.8),18px);
  color:var(--cream);
  opacity:0.75;
  margin-top:calc(var(--vh) * 0.2);
}

/* ACTIVE PROMO CODES (only rendered when at least one non-single-use coupon exists) */
.promo-title{
  font-family:'Baloo 2',sans-serif;
  font-weight:800;
  font-size:clamp(20px,calc(var(--vh) * 3.6),34px);
  color:var(--gold-bright);
  margin-bottom:calc(var(--vh) * 0.6);
}
.promo-item{
  font-size:clamp(16px,calc(var(--vh) * 2.6),26px);
  color:var(--cream);
  margin-bottom:calc(var(--vh) * 0.3);
}
.promo-code{color:var(--gold-bright);font-weight:700}

/* CUSTOMIZE */
.customize-title{
  font-family:'Baloo 2',sans-serif;
  font-weight:800;
  font-size:clamp(22px,calc(var(--vh) * 4),38px);
  color:var(--gold-bright);
  line-height:1.05;
}
.customize-list{
  list-style:none;
  display:grid;
  grid-template-columns:repeat(2, auto);
  justify-content:center;
  column-gap:calc(var(--vw) * 3.5);
  row-gap:calc(var(--vh) * 0.5);
  font-size:clamp(22px,calc(var(--vh) * 3.6),40px);
  color:var(--cream);
}
.customize-list li{position:relative;padding-left:1.15em;text-align:left}
.customize-list li::before{content:'•';position:absolute;left:0;color:var(--cream)}

/* DRINKS */
.drinks-pictures{
  display:flex;
  flex-wrap:nowrap;
  align-items:flex-start;
  justify-content:space-between;
  gap:calc(var(--vw) * 0.6);
  margin-top:calc(var(--vh) * 1.2);
  width:97%;
  max-width:1870px;
}
.drink-pic-card{
  display:flex;
  flex-direction:column;
  align-items:center;
  flex:1 1 0;
  min-width:0;
}
.drink-pic-card img{
  width:100%;
  height:calc(var(--vh) * 15);
  object-fit:contain;
}
.drink-pic-name{
  font-size:clamp(14px,calc(var(--vh) * 2.2),22px);
  color:var(--cream);
  margin-top:calc(var(--vh) * 0.4);
  text-align:center;
}

/* CLOSED OVERLAY */
.closed-overlay{
  display:none;
  position:absolute;inset:0;
  background:#000;
  flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  padding:calc(var(--vh) * 6) calc(var(--vw) * 8);
  z-index:99;
}
.closed-overlay.show{display:flex}
.closed-icon{font-size:clamp(40px,calc(var(--vh) * 8),76px);margin-bottom:calc(var(--vh) * 2)}
.closed-title{
  font-family:'Baloo 2',sans-serif;
  font-weight:800;
  font-size:clamp(24px,calc(var(--vh) * 5),44px);
  color:var(--gold-bright);
  margin-bottom:calc(var(--vh) * 1.2);
}
.closed-sub{
  font-size:clamp(14px,calc(var(--vh) * 2.2),20px);
  color:var(--cream);
  opacity:0.8;
}
</style>
</head>
<body>

<div id="rotator" class="rot-0">

<div class="closed-overlay" id="closed-overlay">
  <div class="closed-icon">🔒</div>
  <div class="closed-title">The Buff is Closed</div>
  <div class="closed-sub" id="closed-msg">We'll be back soon!</div>
</div>

<div class="display">

  <div class="logo" id="logo-text">The Buff</div>
  <img class="logo-img" id="logo-img" alt="The Buff logo">
  <div class="divider"></div>

  <div class="wait-section">
    <div class="wait-label">Estimated Wait</div>
    <div class="wait-time" id="wait-time">—</div>
    <div class="wait-unit" id="wait-unit">minutes</div>
    <div class="wait-stats" id="wait-stats"></div>
  </div>

  <div id="promo-wrap" style="display:none;width:100%">
    <div class="divider"></div>
    <div class="promo-section" id="promo-section"></div>
  </div>

  <div class="divider"></div>

  <div class="menu-section" id="menu-list"></div>

  <div id="special-wrap" style="display:none;width:100%">
    <div class="divider"></div>
    <div class="special-section" id="special-section"></div>
  </div>

  <div class="divider"></div>

  <div class="customize-section">
    <div class="customize-title">Customize<br>your food!</div>
    <ul class="customize-list" id="customize-list">
      <li>Buffalo Sauce</li>
      <li>Ranch</li>
      <li>Hot Honey</li>
      <li>BBQ Sauce</li>
      <li>Bacon</li>
      <li>Extra Cheese</li>
    </ul>
  </div>

  <div class="divider"></div>

  <div class="drinks-section">
    <div class="drinks-pictures" id="drinks-pictures"></div>
  </div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCG5nhzdAHBTGg2eXXmhqH8pF8S8qFqM7o",
  authDomain: "duncan--the-buff.firebaseapp.com",
  databaseURL: "https://duncan--the-buff-default-rtdb.firebaseio.com",
  projectId: "duncan--the-buff",
  storageBucket: "duncan--the-buff.firebasestorage.app",
  messagingSenderId: "561324530375",
  appId: "1:561324530375:web:e6927aefd39ac790737ce2"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let menu = [];
let waittimeSettings = {};
let openOrderCount = 0;
let doneOrderCount = 0;
let drinkPictures = {};

const DEFAULT_CUSTOMIZE_OPTIONS = ['Buffalo Sauce','Ranch','Hot Honey','BBQ Sauce','Bacon','Extra Cheese'];
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
let specials = {};
let coupons = {};

function renderCustomizeOptions(options) {
  const el = document.getElementById('customize-list');
  if (!el) return;
  const list = (options && options.length) ? options : DEFAULT_CUSTOMIZE_OPTIONS;
  el.innerHTML = list.map(name => `<li>${escapeHtml(name)}</li>`).join('');
}

// Only shows up at all if at least one special is active for today (specific day match or "Daily")
function renderSpecials() {
  const wrap = document.getElementById('special-wrap');
  const container = document.getElementById('special-section');
  if (!wrap || !container) return;
  const today = DAY_NAMES[new Date().getDay()];
  const active = Object.values(specials).filter(s => s && s.active !== false && (s.day === today || s.day === 'Daily'));
  if (!active.length) {
    wrap.style.display = 'none';
    container.innerHTML = '';
    return;
  }
  wrap.style.display = 'block';
  container.innerHTML = `<div class="special-title">⭐ Today's Special${active.length > 1 ? 's' : ''}</div>` +
    active.map(s => `
      <div class="special-item">
        <div class="special-name-row">
          <span class="special-name">${escapeHtml(s.name)}</span>
          ${s.tag ? `<span class="special-tag">${escapeHtml(s.tag)}</span>` : ''}
          <span class="special-price">$${parseFloat(s.price || 0).toFixed(2)}</span>
        </div>
        ${s.desc ? `<div class="special-desc">${escapeHtml(s.desc)}</div>` : ''}
      </div>`).join('');
}

// Only shows up if at least one active, non-single-use coupon exists
function renderPromos() {
  const wrap = document.getElementById('promo-wrap');
  const container = document.getElementById('promo-section');
  if (!wrap || !container) return;
  const active = Object.values(coupons).filter(c => c && !c.singleUse);
  if (!active.length) {
    wrap.style.display = 'none';
    container.innerHTML = '';
    return;
  }
  wrap.style.display = 'block';
  container.innerHTML = `<div class="promo-title">🎉 Active Promo Codes</div>` +
    active.map(c => {
      const reward = c.type === 'percent' ? `${c.value}% off` : `$${parseFloat(c.value).toFixed(2)} off`;
      const min = c.minOrder ? ` (min $${parseFloat(c.minOrder).toFixed(2)})` : '';
      return `<div class="promo-item"><span class="promo-code">${escapeHtml(c.code)}</span> — ${reward}${min}</div>`;
    }).join('');
}

function escapeHtml(str) {
  return String(str||'').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

// ── Drink pictures — each is linked to a real menu item's id and follows that item's own availability toggle.
// Display order always matches that item's actual position in the Menu tab (category order, then item order within it).
function renderDrinkPictures() {
  const el = document.getElementById('drinks-pictures');
  if (!el) return;
  el.innerHTML = '';
  const entries = [];
  Object.values(drinkPictures).forEach(dp => {
    let foundItem = null, catIndex = -1, itemIndex = -1;
    menu.forEach((cat, ci) => {
      (cat.items || []).forEach((it, ii) => {
        if (it.id === dp.itemId) { foundItem = it; catIndex = ci; itemIndex = ii; }
      });
    });
    if (!foundItem || foundItem.unavailable === true) return; // hidden if item was deleted or toggled off
    entries.push({ dp, item: foundItem, sortKey: catIndex * 100000 + itemIndex });
  });
  entries.sort((a, b) => a.sortKey - b.sortKey);
  entries.forEach(({ dp, item }) => {
    const card = document.createElement('div');
    card.className = 'drink-pic-card';
    card.innerHTML = `<img src="${dp.image}" alt="${escapeHtml(item.name)}"><div class="drink-pic-name">${escapeHtml(item.name)}</div>`;
    el.appendChild(card);
  });
}

// Only items currently toggled AVAILABLE (Inventory tab) are shown here — this list updates instantly.
// Any category named like "Drinks" is skipped entirely here (drinks are shown only as pictures further down),
// and any individual item that already has a picture is skipped too, so nothing shows twice.
function renderMenuList() {
  const el = document.getElementById('menu-list');
  el.innerHTML = '';
  const picturedItemIds = new Set(Object.values(drinkPictures).map(dp => dp.itemId));
  menu.forEach(cat => {
    if ((cat.label || '').toLowerCase().includes('drink')) return;
    const availableItems = (cat.items || []).filter(i => i.unavailable !== true && !picturedItemIds.has(i.id));
    if (!availableItems.length) return;
    const catLabel = document.createElement('div');
    catLabel.className = 'menu-cat-label';
    catLabel.textContent = cat.label || '';
    el.appendChild(catLabel);
    availableItems.forEach(item => {
      const row = document.createElement('div');
      row.className = 'menu-row';
      row.innerHTML = `<span class="mname">${escapeHtml(item.name)}</span><span class="mprice">$${parseFloat(item.price || 0).toFixed(2)}</span>`;
      el.appendChild(row);
    });
  });
  if (!el.children.length) {
    el.innerHTML = '<div class="menu-empty">Menu coming soon</div>';
  }
}

function updateWaitDisplay() {
  const d = waittimeSettings;

  const closed = d.closed === true;
  document.getElementById('closed-overlay').className = 'closed-overlay' + (closed ? ' show' : '');
  if (d.closedMsg) document.getElementById('closed-msg').textContent = d.closedMsg;

  const defaultMpo = parseFloat(d.minsPerOrder) || 2;
  let effectiveMpo = defaultMpo;
  if (d.activeStaffMpo) effectiveMpo = parseFloat(d.activeStaffMpo);

  const totalSecs = Math.round(openOrderCount * effectiveMpo * 60);
  const wtEl = document.getElementById('wait-time');
  const wuEl = document.getElementById('wait-unit');
  if (openOrderCount === 0) {
    wtEl.textContent = 'No Wait';
    wuEl.textContent = 'Order now!';
  } else if (totalSecs < 60) {
    wtEl.textContent = totalSecs;
    wuEl.textContent = 'seconds';
  } else {
    const mins = Math.floor(totalSecs / 60);
    const secs = totalSecs % 60;
    wtEl.textContent = mins;
    wuEl.textContent = secs > 0 ? 'min ' + secs + ' sec' : (mins === 1 ? 'minute' : 'minutes');
  }

  document.getElementById('wait-stats').textContent =
    `${openOrderCount} order${openOrderCount !== 1 ? 's' : ''} ahead  ·  ${doneOrderCount} completed today`;
}

onValue(ref(db, 'specials'), snap => {
  specials = snap.val() || {};
  renderSpecials();
});
setInterval(renderSpecials, 60000); // catches the day rolling over past midnight

onValue(ref(db, 'coupons'), snap => {
  coupons = snap.val() || {};
  renderPromos();
});

onValue(ref(db, 'menu'), snap => {
  menu = snap.val() ? Object.values(snap.val()) : [];
  renderMenuList();
  renderDrinkPictures();
});

onValue(ref(db, 'drinkPictures'), snap => {
  drinkPictures = snap.val() || {};
  renderMenuList();
  renderDrinkPictures();
});

// ── Screen rotation (set from admin's Lounge Display tab) ──
let currentRotation = 0;

function updateViewportVars() {
  const w = window.innerWidth, h = window.innerHeight;
  // On 90/270, the effective content box is swapped relative to the true window
  const effW = (currentRotation === 90 || currentRotation === 270) ? h : w;
  const effH = (currentRotation === 90 || currentRotation === 270) ? w : h;
  document.documentElement.style.setProperty('--vh', (effH / 100) + 'px');
  document.documentElement.style.setProperty('--vw', (effW / 100) + 'px');
}

function applyRotation(deg) {
  currentRotation = [0, 90, 180, 270].includes(deg) ? deg : 0;
  const rotator = document.getElementById('rotator');
  if (rotator) rotator.className = 'rot-' + currentRotation;
  updateViewportVars();
}

window.addEventListener('resize', updateViewportVars);
applyRotation(0);

// Custom uploaded logo (admin's Lounge Display tab) — falls back to the script text logo if none is set
onValue(ref(db, 'loungeDisplay'), snap => {
  const d = snap.val() || {};
  const textEl = document.getElementById('logo-text');
  const imgEl = document.getElementById('logo-img');
  if (d.logo) {
    imgEl.src = d.logo;
    imgEl.style.display = 'block';
    textEl.style.display = 'none';
  } else {
    imgEl.style.display = 'none';
    textEl.style.display = 'block';
  }
  applyRotation(parseInt(d.rotation, 10) || 0);
  renderCustomizeOptions(d.customizeOptions ? Object.values(d.customizeOptions) : null);
});

onValue(ref(db, 'waittime'), snap => {
  waittimeSettings = snap.val() || {};
  updateWaitDisplay();
});

onValue(ref(db, 'orders'), snap => {
  const data = snap.val() || {};
  const all = Object.values(data);
  openOrderCount = all.filter(o => o.status === 'pending').length;
  doneOrderCount = all.filter(o => o.status === 'done').length;
  updateWaitDisplay();
});
</script>
</body>
</html>
