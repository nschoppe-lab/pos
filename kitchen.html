<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Display</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:#1a1a1a;color:#fff;min-height:100vh}
/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#111;border:1px solid #333;border-radius:12px;padding:32px;width:360px;max-width:100%}
.login-logo{font-size:22px;font-weight:700;color:#ff6b35;margin-bottom:4px}
.login-sub{font-size:13px;color:#888;margin-bottom:24px}
.login-box label{font-size:11px;color:#888;font-weight:600;display:block;margin-bottom:4px;margin-top:14px}
.login-box label:first-of-type{margin-top:0}
.login-box input{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:10px 12px;font-size:14px;color:#fff}
.login-box input:focus{outline:none;border-color:#ff6b35}
.login-box input::placeholder{color:#555}
.login-btn{width:100%;background:#ff6b35;color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:18px;transition:all 0.15s}
.login-btn:hover{background:#e55a2b}
.login-err{background:#2a0e0e;color:#ef4444;border-radius:6px;padding:8px 12px;font-size:13px;margin-top:12px;display:none}
/* KITCHEN */
.kitchen{display:none;flex-direction:column;min-height:100vh}
.topbar{background:#111;padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #333;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.brand{font-size:16px;font-weight:700;color:#ff6b35}
.open-pill{background:#2a1f0e;color:#f59e0b;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px}
.hint{font-size:11px;color:#666}
.logout-btn{background:none;border:1px solid #333;color:#888;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
.logout-btn:hover{border-color:#555;color:#ccc}
.orders-grid{flex:1;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;align-content:start;overflow-y:auto}
.empty{text-align:center;padding:60px;color:#555;grid-column:1/-1}
.oc{background:#1e1e1e;border:1.5px solid #333;border-radius:10px;overflow:hidden;cursor:pointer;user-select:none;transition:border-color 0.15s}
.oc:hover{border-color:#ff6b35}
.oc.flash{border-color:#f59e0b}
.oc.done{border-color:#22c55e;opacity:0.5}
.oc.paid:not(.done){border-color:#22c55e;box-shadow:0 0 0 1px #22c55e44}
.oc-hdr{padding:10px 14px;background:#252525;display:flex;justify-content:space-between;align-items:center}
.oc-num{font-size:13px;font-weight:700;color:#ff6b35}
.oc-name{font-size:13px;font-weight:600}
.oc-time{font-size:11px;color:#888}
.oc-body{padding:10px 14px}
.oc-line{font-size:12px;color:#ccc;padding:2px 0}
.oc-line span{color:#777}
.oc-total{font-size:12px;font-weight:700;color:#ff6b35;margin-top:6px;padding-top:6px;border-top:1px solid #333}
.oc-foot{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#1a1a1a;border-top:1px solid #333}
.sbadge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px}
.sbadge.pending{background:#2a1f0e;color:#f59e0b}
.sbadge.done{background:#052e16;color:#22c55e}
.tap-hint{font-size:10px;color:#555}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:999}
.modal{background:#1e1e1e;border:1px solid #333;border-radius:11px;padding:22px;width:340px;max-width:92vw}
.modal h3{font-size:15px;font-weight:700;margin-bottom:5px}
.modal p{font-size:12px;color:#aaa;margin-bottom:14px}
.mbtns{display:flex;gap:7px;justify-content:flex-end;margin-top:14px}
.mbtn{padding:8px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.mbtn.cancel{background:#333;color:#ccc}
.mbtn.cancel:hover{background:#3a3a3a}
.sms-link{display:block;background:#052e16;border:1px solid #22c55e;color:#22c55e;border-radius:7px;padding:11px;text-decoration:none;font-size:13px;font-weight:600;text-align:center;margin-top:8px}
.sms-link:hover{background:#0a3d1e}
/* PRINT TICKET (hidden on screen, shown only when printing) */
#print-ticket{display:none}
@page{size:80mm auto;margin:0}
@media print{
  body *{visibility:hidden}
  #print-ticket,#print-ticket *{visibility:visible}
  #print-ticket{display:block;position:absolute;top:0;left:0;width:80mm}
  .pt-wrap{width:80mm;padding:6mm 4mm;font-family:'Courier New',monospace;color:#000;text-align:center;box-sizing:border-box}
  .pt-name{font-size:15px;font-weight:700;margin-bottom:3mm;word-break:break-word}
  .pt-items{font-size:13px;margin-bottom:3mm;text-align:left;width:100%}
  .pt-line{padding:1mm 0;border-bottom:1px dashed #000}
  .pt-line:last-child{border-bottom:none}
  .pt-tag{font-size:10px;font-weight:900}
  .pt-sauce{font-size:11px;padding:0 0 1mm 3mm;text-align:left}
  .pt-coupon{font-size:12px;font-weight:700;text-align:left;margin-bottom:2mm}
  .pt-total{font-size:14px;font-weight:900;text-align:left;margin-bottom:2mm;padding-top:2mm;border-top:1px dashed #000}
  .pt-msg-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-top:3mm;margin-bottom:1mm;text-align:left}
  .pt-msg{font-size:12px;text-align:left;padding:2mm;border:1px dashed #000;margin-bottom:3mm;word-break:break-word}
  .pt-paid{font-size:20px;font-weight:900;letter-spacing:2px;border:2px solid #000;display:inline-block;padding:4px 16px;margin-top:2mm}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <div class="login-logo">&#9654; Kitchen Display</div>
    <div class="login-sub">Employee login required</div>
    <label>Email</label>
    <input type="email" id="login-email" placeholder="your@email.com">
    <label>Password</label>
    <input type="password" id="login-pass" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- KITCHEN -->
<div class="kitchen" id="kitchen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="brand">&#9654; Kitchen</div>
      <div class="open-pill" id="open-pill">0 open</div>
      <div class="hint">Double-tap to complete</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="logout-btn" id="reopen-status" style="display:none;background:#0e2a1a;border-color:#22c55e44;color:#22c55e;cursor:default"></span>
      <button class="logout-btn" id="reopen-btn" onclick="reopenTemporarily()" style="display:none;background:#0e2a1a;border-color:#22c55e44;color:#22c55e">🔓 Reopen 5 Min</button>
      <button class="logout-btn" onclick="doLogout()" style="background:#2a1010;border-color:#7f1d1d;color:#ef4444">🔴 Clock Out</button>
    </div>
  </div>
  <div class="orders-grid" id="orders-grid"><div class="empty">No open orders</div></div>
</div>

<div class="modal-bg" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<div id="print-ticket"></div>

<script type="module">
// Initialize EmailJS
emailjs.init("yoxsvEb1uuAA4Ytcd");

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, onValue, update, get, set, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCG5nhzdAHBTGg2eXXmhqH8pF8S8qFqM7o",
  authDomain: "duncan--the-buff.firebaseapp.com",
  databaseURL: "https://duncan--the-buff-default-rtdb.firebaseio.com",
  projectId: "duncan--the-buff",
  storageBucket: "duncan--the-buff.firebasestorage.app",
  messagingSenderId: "561324530375",
  appId: "1:561324530375:web:e6927aefd39ac790737ce2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let orders = {};
let tapTimers = {};
let waittimeSettings = {};
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

let currentUID = null;
let currentUserName = '';

onAuthStateChanged(auth, async user => {
  if (user) {
    currentUID = user.uid;
    const snap = await get(ref(db, `users/${user.uid}`));
    const userData = snap.val();
    if (!userData) { await signOut(auth); showError('Account not found.'); return; }
    if (userData.role === 'kitchen' || userData.role === 'admin') {
      currentUserName = userData.name || '';
      // Mark staff as online
      await update(ref(db, `users/${user.uid}`), { online: true, lastLogin: new Date().toISOString() });
      try {
        await update(ref(db, 'waittime'), { closed: false, manualOverride: false });
      } catch(e) { console.warn('Could not update waittime on login:', e); }
      try {
        await push(ref(db, 'shiftLog'), { uid: user.uid, name: currentUserName, action: 'in', timestamp: Date.now() });
      } catch(e) { console.warn('Could not log shift sign-on:', e); }
      showKitchen(userData);
    } else {
      await signOut(auth);
      showError('Access denied. Kitchen accounts only.');
    }
  } else {
    currentUID = null;
    document.getElementById('login-wrap').style.display = 'flex';
    document.getElementById('kitchen').style.display = 'none';
  }
});

// Mark offline if browser/tab is closed
window.addEventListener('beforeunload', async () => {
  if (currentUID) {
    // Use sendBeacon for reliability on page close
    const url = `https://duncan--the-buff-default-rtdb.firebaseio.com/users/${currentUID}/online.json`;
    navigator.sendBeacon(url + '?auth=', JSON.stringify(false));
  }
});

window.doLogin = async function() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-err');
  errEl.style.display = 'none';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    errEl.style.display = 'block';
    errEl.textContent = 'Invalid email or password.';
  }
}

window.doLogout = async function() {
  if (currentUID) {
    try {
      await push(ref(db, 'shiftLog'), { uid: currentUID, name: currentUserName, action: 'out', timestamp: Date.now() });
    } catch(e) { console.warn('Could not log shift sign-off:', e); }
    // Mark this staff member offline
    await update(ref(db, `users/${currentUID}`), { online: false });
    // Check if any other kitchen staff are still online
    const usersSnap = await get(ref(db, 'users'));
    const users = usersSnap.val() || {};
    const anyoneOnline = Object.values(users).some(u => u.online === true && u.uid !== currentUID);
    // If nobody else is online, close The Buff
    if (!anyoneOnline) {
      try {
        await update(ref(db, 'waittime'), { closed: true, manualOverride: false });
      } catch(e) { console.warn('Could not update waittime on logout:', e); }
    }
  }
  await signOut(auth);
}

function showError(msg) {
  const errEl = document.getElementById('login-err');
  errEl.style.display = 'block';
  errEl.textContent = msg;
}

function showKitchen(userData) {
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('kitchen').style.display = 'flex';
  // Show staff name in header
  if (userData && userData.name) {
    const brand = document.querySelector('.brand');
    if (brand) brand.textContent = '▶ Kitchen — ' + userData.name;
  }
  // Listen to orders in real time
  onValue(ref(db, 'orders'), snap => {
    orders = snap.val() || {};
    renderOrders();
  });
  // Listen to wait time / schedule settings (drives the reopen button + auto close enforcement)
  onValue(ref(db, 'waittime'), snap => {
    waittimeSettings = snap.val() || {};
    updateReopenUI();
  });
  if (!window._scheduleInterval) {
    window._scheduleInterval = setInterval(checkScheduleAndReport, 15000);
  }
  checkScheduleAndReport();
  if (!window._reopenTickInterval) {
    window._reopenTickInterval = setInterval(updateReopenUI, 1000);
  }
}

function renderOrders() {
  const grid = document.getElementById('orders-grid');
  const allOrders = Object.entries(orders).map(([k,v]) => ({fbKey:k,...v}));
  const open = allOrders.filter(o => o.status === 'pending').sort((a,b) => (a.createdAt||0)-(b.createdAt||0));
  const recent = allOrders.filter(o => o.status === 'done').sort((a,b) => (b.createdAt||0)-(a.createdAt||0)).slice(0,6);
  const all = [...open, ...recent];

  document.getElementById('open-pill').textContent = `${open.length} open`;
  if (!all.length) { grid.innerHTML = '<div class="empty">No orders yet</div>'; return; }

  grid.innerHTML = '';
  all.forEach(order => {
    const card = document.createElement('div');
    card.className = 'oc' + (order.status==='done' ? ' done' : '') + (order.paid ? ' paid' : '');
    card.dataset.key = order.fbKey;
    card.innerHTML = `
      <div class="oc-hdr">
        <span class="oc-num">#${order.fbKey.slice(-4).toUpperCase()}</span>
        <span class="oc-name">${order.name}</span>
        <span class="oc-time">${order.time||''}</span>
      </div>
      <div class="oc-body">
        ${order.delivery?`<div style="font-size:11px;color:#3b82f6;font-weight:700;margin-bottom:5px;padding:5px 8px;background:#0e1a2a;border-radius:5px">🚚 DELIVERY → ${order.deliveryLocation||'—'}${order.deliveryPhone?' · 📞 '+order.deliveryPhone:''}</div>`:''}
        ${order.preorder?`<div style="font-size:11px;color:#a78bfa;font-weight:700;margin-bottom:5px;padding:5px 8px;background:#1a1030;border-radius:5px">⏰ PRE-ORDER</div>`:''}
        ${(order.items||[]).map(i=>`<div class="oc-line"><span>${i.qty}x</span> ${i.name}</div>${i.sauces&&i.sauces.length?`<div style="font-size:11px;color:#f59e0b;padding-left:18px">🥫 Side: ${i.sauces.join(', ')}</div>`:''}`).join('')}
        ${order.discount>0?`<div style="font-size:11px;color:#22c55e;margin-top:4px">Disc: -$${parseFloat(order.discount).toFixed(2)}</div>`:''}
        ${order.comments?`<div style="font-size:11px;color:#f59e0b;margin-top:5px;padding:5px 8px;background:#2a1f0e;border-radius:5px">&#128172; ${order.comments}</div>`:''}
        <div class="oc-total">$${parseFloat(order.total).toFixed(2)}</div>
      </div>
      <div class="oc-foot">
        <span class="sbadge ${order.status==='done'?'done':'pending'}">${order.status==='done'?'Done':'In Progress'}</span>
        ${order.status==='done'
          ? `<button onclick="event.stopPropagation();undoDone('${order.fbKey}')" style="background:#2a1f0e;border:1px solid #f59e0b44;color:#f59e0b;border-radius:6px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer">↩ Undo</button>`
          : `<label onclick="event.stopPropagation()" style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;${order.paid ? 'background:#052e16;color:#22c55e' : 'background:#1a1a1a;color:#555;border:1px solid #333'}">
          <input type="checkbox" ${order.paid ? 'checked' : ''} onclick="event.stopPropagation()" onchange="togglePaid('${order.fbKey}', this.checked)" style="accent-color:#22c55e;width:14px;height:14px">
          ${order.paid ? '✓ PAID' : 'Mark Paid'}
        </label>`}
        <span class="tap-hint">${order.status==='done'?'Completed':'Double-tap to complete'}</span>
      </div>`;
    if (order.status !== 'done') {
      card.addEventListener('click', () => handleTap(order.fbKey, order));
    }
    grid.appendChild(card);
  });
}

function handleTap(key, order) {
  if (tapTimers[key]) {
    clearTimeout(tapTimers[key]);
    delete tapTimers[key];
    markDone(key, order);
  } else {
    const card = document.querySelector(`.oc[data-key="${key}"]`);
    if (card) card.classList.add('flash');
    tapTimers[key] = setTimeout(() => {
      delete tapTimers[key];
      const c = document.querySelector(`.oc[data-key="${key}"]`);
      if (c) c.classList.remove('flash');
    }, 600);
  }
}

async function markDone(key, order) {
  await update(ref(db, `orders/${key}`), { status: 'done' });
  // Only send email if not already sent (prevents duplicate with admin screen)
  if (order.email && !order.emailSent) {
    await update(ref(db, `orders/${key}`), { emailSent: true });
    sendOrderReadyEmail(order);
  }
}

async function sendOrderReadyEmail(order) {
  try {
    const itemsList = (order.items||[]).map(i => `${i.qty}x ${i.name}`).join(', ');
    await emailjs.send("service_imhcg7n", "template_l8uulwk", {
      to_name: order.name,
      to_email: order.email,
      from_name: "The Buff - Duncan Hall",
      order_details: itemsList + (order.comments ? `\nNote: ${order.comments}` : ''),
      reply_to: "duncan@nd.edu"
    });
    showModal(`<h3 style="color:#22c55e">&#10003; Order done!</h3><p style="font-size:13px;color:#aaa">Email sent to <strong style="color:#fff">${order.name}</strong> at ${order.email}</p><div class="mbtns"><button class="mbtn cancel" onclick="closeModal()">Close</button></div>`);
  } catch(e) {
    showModal(`<h3 style="color:#22c55e">&#10003; Order marked done!</h3><p style="font-size:12px;color:#aaa">Could not send email automatically. You can notify ${order.name} manually.</p><div class="mbtns"><button class="mbtn cancel" onclick="closeModal()">Close</button></div>`);
    console.error('EmailJS error:', e);
  }
}

window.undoDone = async function(key) {
  await update(ref(db, `orders/${key}`), { status: 'pending' });
}

window.togglePaid = async function(key, paid) {
  if (paid) {
    const order = orders[key];
    if (order) printPaidTicket(order);
  }
  await update(ref(db, `orders/${key}`), { paid });
}

function escapeHtml(str) {
  return String(str||'').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function printPaidTicket(order) {
  const ticket = document.getElementById('print-ticket');
  if (!ticket) return;
  const itemsHtml = (order.items||[]).map(i => {
    const specialTag = i.isSpecial ? ' <span class="pt-tag">★ SPECIAL</span>' : '';
    const sauceNote = (i.sauces && i.sauces.length) ? `<div class="pt-sauce">🥫 Side: ${escapeHtml(i.sauces.join(', '))}</div>` : '';
    return `<div class="pt-line">${escapeHtml(i.qty)}x ${escapeHtml(i.name)}${specialTag}</div>${sauceNote}`;
  }).join('');
  const msgHtml = order.comments
    ? `<div class="pt-msg-label">Message</div><div class="pt-msg">${escapeHtml(order.comments)}</div>`
    : '';
  const deliveryHtml = order.delivery
    ? `<div class="pt-msg-label">🚚 Delivery</div><div class="pt-msg">${escapeHtml(order.deliveryLocation || '—')}${order.deliveryPhone ? '<br>Phone: ' + escapeHtml(order.deliveryPhone) : ''}</div>`
    : '';
  const couponHtml = order.coupon
    ? `<div class="pt-coupon">Coupon used: ${escapeHtml(order.coupon)}${order.discount ? ' (-$' + parseFloat(order.discount).toFixed(2) + ')' : ''}</div>`
    : '';
  const totalHtml = `<div class="pt-total">Total: $${parseFloat(order.total||0).toFixed(2)}</div>`;
  ticket.innerHTML = `
    <div class="pt-wrap">
      <div class="pt-name">${escapeHtml(order.name)}</div>
      <div class="pt-items">${itemsHtml}</div>
      ${deliveryHtml}
      ${couponHtml}
      ${totalHtml}
      ${msgHtml}
      <div class="pt-paid">PAID</div>
    </div>`;
  window.print();
}

window.showModal = function(html) { document.getElementById('modal-content').innerHTML=html; document.getElementById('modal').style.display='flex'; }
window.closeModal = function() { document.getElementById('modal').style.display='none'; }

// ── REOPEN FOR 5 MORE MINUTES ────────────────────────────────────
window.reopenTemporarily = async function() {
  const until = Date.now() + 5*60*1000;
  try { await update(ref(db, 'waittime'), { closed: false, manualOverride: true, tempReopenUntil: until }); }
  catch(e) { alert('Error: ' + e.message); }
}

function updateReopenUI() {
  const btn = document.getElementById('reopen-btn');
  const status = document.getElementById('reopen-status');
  if (!btn || !status) return;
  const w = waittimeSettings;
  const now = Date.now();
  const activeReopen = w.tempReopenUntil && w.closed === false && w.tempReopenUntil > now;
  if (activeReopen) {
    btn.style.display = 'none';
    status.style.display = 'inline-flex';
    const secsLeft = Math.max(0, Math.round((w.tempReopenUntil - now) / 1000));
    const m = Math.floor(secsLeft / 60), s = secsLeft % 60;
    status.textContent = `⏳ Reopened — closes in ${m}:${String(s).padStart(2,'0')}`;
  } else {
    status.style.display = 'none';
    btn.style.display = (w.closed === true) ? 'inline-flex' : 'none';
  }
}

// ── SCHEDULE ENFORCEMENT + NIGHTLY REPORT TRIGGER ────────────────
// Runs every 15s so the ordering page reliably closes/reopens on schedule (not just on
// staff login/logout), the "reopen 5 more minutes" grace period expires on time, and the
// nightly report fires 10 minutes after closing.
async function checkScheduleAndReport() {
  try {
    const w = waittimeSettings;

    // Expire an active temp reopen
    if (w.tempReopenUntil && w.closed === false && w.tempReopenUntil <= Date.now()) {
      await update(ref(db, 'waittime'), { closed: true, manualOverride: false, tempReopenUntil: null });
      return; // let the next tick re-evaluate with fresh data
    }

    // Enforce the normal schedule (skipped while a manual override / temp reopen is active)
    const dayName = DAYS[new Date().getDay()];
    const h = w['hours_' + dayName];
    if (!w.manualOverride) {
      if (!h || h.enabled !== true) {
        if (!w.closed) await update(ref(db, 'waittime'), { closed: true });
      } else {
        const [sh,sm] = (h.open||'10:00').split(':').map(Number);
        const [eh,em] = (h.close||'22:00').split(':').map(Number);
        const nowM = new Date().getHours()*60 + new Date().getMinutes();
        const shouldBeOpen = nowM >= sh*60+sm && nowM < eh*60+em;
        if (shouldBeOpen && w.closed) await update(ref(db, 'waittime'), { closed: false });
        if (!shouldBeOpen && !w.closed) await update(ref(db, 'waittime'), { closed: true });
      }
    }

    await checkNightlyReportTrigger();
  } catch(e) { console.error('Schedule check error:', e); }
}

function localDateKey(d) {
  d = d || new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function dayBoundsMs(dateKey) {
  const [y,m,d] = dateKey.split('-').map(Number);
  return { start: new Date(y, m-1, d, 0,0,0,0).getTime(), end: new Date(y, m-1, d, 23,59,59,999).getTime() };
}

function round2(n) { return Math.round(n*100)/100; }

function safeFirebaseKey(str) { return String(str).replace(/[.#$\[\]\/]/g, '_'); }

function fmtTime(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
}

async function buildWorkerSummary(start, end) {
  const snap = await get(ref(db, 'shiftLog'));
  const all = snap.val() ? Object.values(snap.val()) : [];
  const todays = all.filter(e => typeof e.timestamp === 'number' && e.timestamp >= start && e.timestamp <= end);
  const byUid = {};
  todays.forEach(e => {
    if (!byUid[e.uid]) byUid[e.uid] = { name: e.name || 'Unknown', signOn: null, signOff: null };
    if (e.action === 'in'  && (byUid[e.uid].signOn  === null || e.timestamp < byUid[e.uid].signOn))  byUid[e.uid].signOn  = e.timestamp;
    if (e.action === 'out' && (byUid[e.uid].signOff === null || e.timestamp > byUid[e.uid].signOff)) byUid[e.uid].signOff = e.timestamp;
  });
  return Object.values(byUid);
}

// Pure — reads only, never writes.
async function computeNightlyStats(dateKey) {
  const { start, end } = dayBoundsMs(dateKey);

  const ordersSnap = await get(ref(db, 'orders'));
  const allOrders = ordersSnap.val() ? Object.values(ordersSnap.val()) : [];
  const todays = allOrders.filter(o => typeof o.createdAt === 'number' && o.createdAt >= start && o.createdAt <= end);

  const totalOrders = todays.length;
  const totalRevenue = round2(todays.reduce((s,o) => s + (parseFloat(o.total)||0), 0));
  const avgOrder = totalOrders ? round2(totalRevenue/totalOrders) : 0;
  const deliveryCount = todays.filter(o => o.delivery).length;
  const preorderCount = todays.filter(o => o.preorder).length;
  const couponOrders = todays.filter(o => o.coupon);
  const couponsUsedCount = couponOrders.length;
  const couponsTotalDiscount = round2(couponOrders.reduce((s,o) => s + (parseFloat(o.discount)||0), 0));
  const loyaltyDiscountTotal = round2(todays.reduce((s,o) => s + (parseFloat(o.loyaltyDiscount)||0), 0));

  const itemStats = {};
  let specialItemsSold = 0, sauceRequests = 0;
  todays.forEach(o => (o.items||[]).forEach(i => {
    const qty = parseInt(i.qty) || 1;
    const price = parseFloat(i.price) || 0;
    if (!itemStats[i.name]) itemStats[i.name] = { qty: 0, revenue: 0 };
    itemStats[i.name].qty += qty;
    itemStats[i.name].revenue += qty * price;
    if (i.isSpecial) specialItemsSold += qty;
    if (i.sauces && i.sauces.length) sauceRequests += qty;
  }));
  const itemBreakdown = Object.entries(itemStats)
    .map(([name,v]) => ({ name, qty: v.qty, revenue: round2(v.revenue) }))
    .sort((a,b) => b.qty - a.qty);

  const runningSnap = await get(ref(db, 'itemRunningTotals'));
  const runningCurrent = runningSnap.val() || {};
  const merged = {...runningCurrent};
  itemBreakdown.forEach(it => {
    const key = safeFirebaseKey(it.name);
    const prevQty = (merged[key] && merged[key].qty) || 0;
    merged[key] = { name: it.name, qty: prevQty + it.qty };
  });
  const allTimeTop = Object.values(merged).sort((a,b) => b.qty - a.qty).slice(0,10);

  const workers = await buildWorkerSummary(start, end);

  return {
    date: dateKey, totalOrders, totalRevenue, avgOrder,
    deliveryCount, preorderCount, couponsUsedCount, couponsTotalDiscount,
    loyaltyDiscountTotal, specialItemsSold, sauceRequests,
    itemBreakdown, allTimeTop, workers
  };
}

// Only ever called once per date (guarded in sendNightlyReport).
async function commitRunningItemTotals(itemBreakdown) {
  if (!itemBreakdown.length) return;
  const runningSnap = await get(ref(db, 'itemRunningTotals'));
  const runningCurrent = runningSnap.val() || {};
  const updates = {};
  itemBreakdown.forEach(it => {
    const key = safeFirebaseKey(it.name);
    const prevQty = (runningCurrent[key] && runningCurrent[key].qty) || 0;
    updates[`itemRunningTotals/${key}`] = { name: it.name, qty: prevQty + it.qty };
  });
  await update(ref(db), updates);
}

function buildReportBodyText(data, isTest) {
  const dateObj = new Date(data.date + 'T00:00:00');
  const dateLabel = dateObj.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

  const workersText = data.workers.length
    ? data.workers.map(w => `• ${w.name} — signed on ${fmtTime(w.signOn)}, signed off ${fmtTime(w.signOff)}`).join('\n')
    : 'No sign-ins recorded';

  const itemsText = data.itemBreakdown.length
    ? data.itemBreakdown.map((it,i) => `${i+1}. ${it.name} — ${it.qty} sold — $${it.revenue.toFixed(2)}`).join('\n')
    : 'No items sold';

  const allTimeText = data.allTimeTop.length
    ? data.allTimeTop.map((it,i) => `${i+1}. ${it.name} — ${it.qty} sold (all-time)`).join('\n')
    : 'No data yet';

  return `THE BUFF — NIGHTLY REPORT${isTest ? ' (TEST)' : ''}
${dateLabel}

STAFF TONIGHT
${workersText}

SALES SUMMARY
Total Orders: ${data.totalOrders}
Total Revenue: $${data.totalRevenue.toFixed(2)}
Average Order: $${data.avgOrder.toFixed(2)}

DELIVERY & PRE-ORDERS
Deliveries: ${data.deliveryCount}
Pre-Orders: ${data.preorderCount}

COUPONS
Used: ${data.couponsUsedCount}
Total Discount Given: $${data.couponsTotalDiscount.toFixed(2)}

LOYALTY
Total Loyalty Credit Used: $${data.loyaltyDiscountTotal.toFixed(2)}

ITEMS SOLD TONIGHT
${itemsText}

ALL-TIME TOP ITEMS (running total across every night)
${allTimeText}

OTHER
Special Items Sold: ${data.specialItemsSold}
Sauce Add-Ons Requested: ${data.sauceRequests}`;
}

async function sendNightlyReport(dateKey) {
  const existingSnap = await get(ref(db, `nightlyReports/${dateKey}`));
  const existing = existingSnap.val();
  if (existing && existing.sent) return; // already fully sent from elsewhere

  let data;
  if (existing && existing.dataGenerated) {
    data = existing;
  } else {
    data = await computeNightlyStats(dateKey);
    await commitRunningItemTotals(data.itemBreakdown);
    data.dataGenerated = true;
    data.reportBody = buildReportBodyText(data, false);
    await set(ref(db, `nightlyReports/${dateKey}`), { ...data, sent: false, generatedAt: Date.now() });
  }

  const cfgSnap = await get(ref(db, 'reportsConfig'));
  const cfg = cfgSnap.val() || {};

  let sent = false, errorMsg = null;
  if (cfg.email && cfg.enabled !== false) {
    try {
      await emailjs.send("service_imhcg7n", "template_nightly_report", {
        to_email: cfg.email,
        report_date: data.date,
        report_body: data.reportBody
      });
      sent = true;
    } catch(e) { errorMsg = (e && e.text) || (e && e.message) || 'Email send failed'; console.error('Nightly report email error:', e); }
  } else {
    errorMsg = cfg.enabled === false ? 'Nightly reports are disabled' : 'No report email configured';
  }

  await update(ref(db, `nightlyReports/${dateKey}`), { sent, emailedTo: cfg.email || null, error: errorMsg, sentAttemptAt: Date.now() });
}

async function checkNightlyReportTrigger() {
  const dateKey = localDateKey();
  const dayName = DAYS[new Date().getDay()];
  const w = waittimeSettings;
  const h = w['hours_' + dayName];
  if (!h || h.enabled !== true) return; // not scheduled open today
  const [eh, em] = (h.close || '22:00').split(':').map(Number);
  const nowM = new Date().getHours()*60 + new Date().getMinutes();
  if (nowM < eh*60 + em + 10) return; // not 10 minutes past close yet
  const existingSnap = await get(ref(db, `nightlyReports/${dateKey}`));
  if (existingSnap.exists() && existingSnap.val().sent) return;
  await sendNightlyReport(dateKey);
}
